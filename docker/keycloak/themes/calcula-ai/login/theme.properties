parent=keycloak
import=common/keycloak
styles=css/login.css
locales=pt-BR,en

# Mapeia as classes das telas base (registro, trocar senha, recuperar senha…)
# para o visual do tema. Assim register.ftl / login-update-password.ftl /
# login-reset-password.ftl herdam o mesmo estilo do login sem precisar de override.
kcFormClass=kc-form
kcFormGroupClass=kc-field
kcLabelWrapperClass=
kcLabelClass=
kcInputWrapperClass=
kcInputGroup=
kcInputClass=
kcInputErrorMessageClass=kc-error
kcInputHelperTextBeforeClass=kc-help
kcInputHelperTextAfterClass=kc-help
kcContentWrapperClass=
kcButtonClass=
kcButtonPrimaryClass=kc-submit
kcButtonDefaultClass=kc-btn-secondary
kcButtonBlockClass=
kcButtonLargeClass=
kcFormButtonsClass=kc-form-buttons
kcFormOptionsClass=kc-form-options
kcFormOptionsWrapperClass=
kcFormSettingClass=kc-row
# O botão nativo de mostrar/ocultar senha usa ícone de fonte (FontAwesome) que
# este tema não carrega; escondemos para não aparecer botão quebrado.
kcFormPasswordVisibilityButtonClass=kc-pw-hidden
