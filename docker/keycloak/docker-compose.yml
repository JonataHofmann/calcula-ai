  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://calculaai-finance-mlfgra:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    command: start-dev
    restart: always
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./docker/keycloak/themes/calcula-ai:/opt/keycloak/themes/calcula-ai:ro
      
volumes:
  postgres-data:
