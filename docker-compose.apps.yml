# Sobe TODAS as aplicações/módulos (sem banco e sem Keycloak).
# Postgres e Keycloak devem rodar por fora (ex.: `docker compose up` do docker-compose.yml,
# ou instâncias locais). Os containers alcançam esses serviços via host.docker.internal.
#
# Uso:  docker compose -f docker-compose.apps.yml up --build
# As variáveis vêm de .env (env_file) e são sobrescritas abaixo com endereços de rede
# válidos DENTRO da rede do compose (nomes de serviço) e do host (host.docker.internal).

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3031
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      CORS_ORIGINS: http://localhost:3030,http://localhost:3040,http://localhost:3032
    ports:
      - "3031:3031"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-ms:
    build:
      context: .
      dockerfile: docker/ai-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      AI_MS_PORT: 3033
      CORS_ORIGINS: http://localhost:3030,http://localhost:3040,http://localhost:3032
    ports:
      - "3033:3033"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  banking-ms:
    build:
      context: .
      dockerfile: docker/banking-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      BANKING_MS_PORT: 3034
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      TRANSACTIONS_MS_URL: http://api:3031
      CORS_ORIGINS: http://localhost:3030,http://localhost:3040,http://localhost:3032
    ports:
      - "3034:3034"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      BFF_PORT: 3032
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      API_URL: http://api:3031
      AI_MS_URL: http://ai-ms:3033
      BANKING_MS_URL: http://banking-ms:3034
      TRANSACTIONS_MS_URL: http://api:3031
      WEB_URL: http://localhost:3030
      BFF_PUBLIC_URL: http://localhost:3032
      CORS_ORIGINS: http://localhost:3030,http://localhost:3040
    ports:
      - "3032:3032"
    depends_on:
      - api
      - ai-ms
      - banking-ms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3030
      NEXT_PUBLIC_BFF_URL: http://localhost:3032
    ports:
      - "3030:3030"
    depends_on:
      - bff

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3040
      NEXT_PUBLIC_BFF_URL: http://localhost:3032
    ports:
      - "3040:3040"
    depends_on:
      - bff
