# Sobe TODAS as aplicações/módulos (sem banco e sem Keycloak).
# Postgres e Keycloak rodam por fora; os containers os alcançam via host.docker.internal.
#
# Uso:  docker compose -f docker-compose.apps.yml up --build
#
# Os valores vêm do .env (carregado por env_file e também pela interpolação ${...} do compose).
# Só sobrescrevemos o que depende da REDE do Docker:
#   - localhost -> host.docker.internal  (DB/Keycloak estão no host, não no container)
#   - localhost -> nome do serviço       (comunicação entre containers na rede do compose)
# As portas e demais segredos são respeitados exatamente como estão no .env.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${API_PORT}:${API_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-ms:
    build:
      context: .
      dockerfile: docker/ai-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${AI_MS_PORT}:${AI_MS_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  banking-ms:
    build:
      context: .
      dockerfile: docker/banking-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${BANKING_MS_PORT}:${BANKING_MS_PORT}"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@host.docker.internal:5432/finance
      KEYCLOAK_URL: http://host.docker.internal:8080
      API_URL: http://api:${API_PORT}
      AI_MS_URL: http://ai-ms:${AI_MS_PORT}
      BANKING_MS_URL: http://banking-ms:${BANKING_MS_PORT}
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
    ports:
      - "${BFF_PORT}:${BFF_PORT}"
    depends_on:
      - api
      - ai-ms
      - banking-ms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3030}
    ports:
      - "${WEB_PORT:-3030}:${WEB_PORT:-3030}"
    depends_on:
      - bff

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_PORT:-3040}
    ports:
      - "${ADMIN_PORT:-3040}:${ADMIN_PORT:-3040}"
    depends_on:
      - bff
