# Sobe TODAS as aplicações/módulos + banco (Postgres) e Keycloak, tudo funcional.
#
# Uso:  docker compose -f docker-compose.apps.yml up --build
#
# Postgres e Keycloak rodam DENTRO deste compose. As apps os alcançam pelos nomes
# de serviço (postgres / keycloak).
#
# Envs: cada serviço carrega o SEU .env (services/<svc>/.env ou apps/<app>/.env) via
# env_file (required:false → se o arquivo não existir, ex. Dokploy com env na UI, não
# quebra). O bloco `environment:` sobrepõe SÓ o que muda na rede docker (host do banco
# /keycloak, URLs por nome de serviço, NODE_ENV, CORS). Para banco/Keycloak externo no
# Dokploy, edite esses overrides.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finance
      KC_DB_PASSWORD: finance
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: services/api/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3030},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL:-http://localhost:3030/bff}
    ports:
      - "${API_PORT:-3031}:${API_PORT:-3031}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-ms:
    build:
      context: .
      dockerfile: docker/ai-ms.Dockerfile
    env_file:
      - path: services/ai-ms/.env
        required: false
    environment:
      NODE_ENV: production
      KEYCLOAK_URL: http://keycloak:8080
      # AI_ROUTER_URL/API_KEY/MODEL vêm do services/ai-ms/.env. Se o 9Router roda no
      # HOST, troque localhost por host.docker.internal no .env (extra_hosts já mapeia).
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3030},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL:-http://localhost:3030/bff}
    ports:
      - "${AI_MS_PORT:-3033}:${AI_MS_PORT:-3033}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  banking-ms:
    build:
      context: .
      dockerfile: docker/banking-ms.Dockerfile
    env_file:
      - path: services/banking-ms/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      TRANSACTIONS_MS_URL: http://api:${API_PORT:-3031}
      CORS_ORIGINS: ${WEB_URL:-http://localhost:3030},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL:-http://localhost:3030/bff}
    ports:
      - "${BANKING_MS_PORT:-3034}:${BANKING_MS_PORT:-3034}"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file:
      - path: services/bff/.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      API_URL: http://api:${API_PORT:-3031}
      AI_MS_URL: http://ai-ms:${AI_MS_PORT:-3033}
      BANKING_MS_URL: http://banking-ms:${BANKING_MS_PORT:-3034}
      TRANSACTIONS_MS_URL: http://api:${API_PORT:-3031}
    ports:
      - "${BFF_PORT:-3032}:${BFF_PORT:-3032}"
    depends_on:
      - api
      - ai-ms
      - banking-ms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # NEXT_PUBLIC_* é embutido no bundle no BUILD — precisa vir como build arg.
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-/bff}
        NEXT_PUBLIC_PLUGGY_INCLUDE_SANDBOX: ${NEXT_PUBLIC_PLUGGY_INCLUDE_SANDBOX:-true}
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3030}
      # Alvo interno do proxy reverso (`/bff/*` -> BFF na rede docker). Runtime.
      BFF_INTERNAL_URL: http://bff:${BFF_PORT:-3032}
    ports:
      - "${WEB_PORT:-3030}:${WEB_PORT:-3030}"
    depends_on:
      - bff

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_PORT:-3040}
    ports:
      - "${ADMIN_PORT:-3040}:${ADMIN_PORT:-3040}"
    depends_on:
      - bff

volumes:
  postgres-data:
