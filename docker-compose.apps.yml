# Sobe TODAS as aplicações/módulos (sem banco e sem Keycloak).
# Postgres e Keycloak rodam por fora; os containers os alcançam via host.docker.internal.
#
# Uso:  docker compose -f docker-compose.apps.yml up --build
#
# Envs definidas no painel do Dokploy chegam via interpolação ${...} do compose.
# DATABASE_URL e KEYCLOAK_URL são injetadas pelo Dokploy (aponte-as para o host onde o
# banco/Keycloak rodam — devem ser acessíveis de dentro do container).
# Só derivamos as URLs de comunicação ENTRE containers (nome do serviço + porta).

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${API_PORT}:${API_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-ms:
    build:
      context: .
      dockerfile: docker/ai-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${AI_MS_PORT}:${AI_MS_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  banking-ms:
    build:
      context: .
      dockerfile: docker/banking-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
    ports:
      - "${BANKING_MS_PORT}:${BANKING_MS_PORT}"
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      API_URL: http://api:${API_PORT}
      AI_MS_URL: http://ai-ms:${AI_MS_PORT}
      BANKING_MS_URL: http://banking-ms:${BANKING_MS_PORT}
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
    ports:
      - "${BFF_PORT}:${BFF_PORT}"
    depends_on:
      - api
      - ai-ms
      - banking-ms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3030}
    ports:
      - "${WEB_PORT:-3030}:${WEB_PORT:-3030}"
    depends_on:
      - bff

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_PORT:-3040}
    ports:
      - "${ADMIN_PORT:-3040}:${ADMIN_PORT:-3040}"
    depends_on:
      - bff
