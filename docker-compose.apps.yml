# Sobe TODAS as aplicações/módulos + banco (Postgres) e Keycloak, tudo funcional.
#
# Uso:  docker compose -f docker-compose.apps.yml up --build
#
# Postgres e Keycloak rodam DENTRO deste compose. As apps os alcançam pelos nomes
# de serviço (postgres / keycloak). DATABASE_URL/KEYCLOAK_URL são fixados aqui para os
# serviços internos (o bloco environment sobrepõe o env_file .env). Para apontar a um
# banco/Keycloak externo no Dokploy, edite estes valores.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: finance
      KC_DB_PASSWORD: finance
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3031}
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-calcula-ai}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-ms:
    build:
      context: .
      dockerfile: docker/ai-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      AI_MS_PORT: ${AI_MS_PORT:-3033}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-calcula-ai}
      AI_ROUTER_URL: ${AI_ROUTER_URL}
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY}
      AI_INVOICE_MODEL: ${AI_INVOICE_MODEL:-gemini/gemini-3.5-flash-lite}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${AI_MS_PORT}:${AI_MS_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  banking-ms:
    build:
      context: .
      dockerfile: docker/banking-ms.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      BANKING_MS_PORT: ${BANKING_MS_PORT:-3034}
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-calcula-ai}
      BANKING_MS_KEYCLOAK_CLIENT_ID: ${BANKING_MS_KEYCLOAK_CLIENT_ID:-calcula-ai-api}
      BANKING_MS_KEYCLOAK_CLIENT_SECRET: ${BANKING_MS_KEYCLOAK_CLIENT_SECRET}
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
      PLUGGY_API_BASE_URL: ${PLUGGY_API_BASE_URL:-https://api.pluggy.ai}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
      PLUGGY_WEBHOOK_SECRET: ${PLUGGY_WEBHOOK_SECRET}
      CORS_ORIGINS: ${WEB_URL},http://localhost:${ADMIN_PORT:-3040},${BFF_PUBLIC_URL}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BANKING_MS_PORT}:${BANKING_MS_PORT}"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bff:
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      BFF_PORT: ${BFF_PORT:-3032}
      DATABASE_URL: postgresql://finance:finance@postgres:5432/finance
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-calcula-ai}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-calcula-ai-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      BFF_PUBLIC_URL: ${BFF_PUBLIC_URL}
      WEB_URL: ${WEB_URL}
      CORS_ORIGINS: ${WEB_URL}
      API_URL: http://api:${API_PORT}
      AI_MS_URL: http://ai-ms:${AI_MS_PORT}
      BANKING_MS_URL: http://banking-ms:${BANKING_MS_PORT}
      TRANSACTIONS_MS_URL: http://api:${API_PORT}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BFF_PORT}:${BFF_PORT}"
    depends_on:
      - api
      - ai-ms
      - banking-ms
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # NEXT_PUBLIC_* é embutido no bundle no BUILD — precisa vir como build arg.
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-/bff}
        NEXT_PUBLIC_PLUGGY_INCLUDE_SANDBOX: ${NEXT_PUBLIC_PLUGGY_INCLUDE_SANDBOX:-true}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3030}
      # Alvo interno do proxy reverso (`/bff/*` -> BFF na rede docker). Runtime.
      BFF_INTERNAL_URL: http://bff:${BFF_PORT:-3032}
    ports:
      - "${WEB_PORT:-3030}:${WEB_PORT:-3030}"
    depends_on:
      - bff

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${ADMIN_PORT:-3040}
    ports:
      - "${ADMIN_PORT:-3040}:${ADMIN_PORT:-3040}"
    depends_on:
      - bff

volumes:
  postgres-data:
